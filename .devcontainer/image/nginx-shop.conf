# nginx front for Juice Shop (Season 1). Matches the canonical breach log:
# - logs every request with its body: nginx combined plus a final quoted body field, JSON-escaped
# - forwards only known shop paths to Juice Shop on :3000; everything else gets nginx's own 404
#   (Juice Shop alone answers unknown paths with its homepage)

map $http_referer $fa_referer { "" "-"; default $http_referer; }
map $http_user_agent $fa_ua { "" "-"; default $http_user_agent; }
map $request_body $fa_body { "" "-"; default $request_body; }
map $http_upgrade $fa_connection { default upgrade; "" close; }

log_format fieldagents escape=json
  '$remote_addr - - [$time_local] "$request" $status $body_bytes_sent "$fa_referer" "$fa_ua" "$fa_body"';

server {
  listen 80 default_server;
  server_name shop.fieldagents.test localhost;
  access_log /var/log/shop/access.log fieldagents;
  error_log /var/log/shop/error.log warn;
  client_max_body_size 10m;
  client_body_buffer_size 1m;  # keep bodies in memory so $request_body is logged

  set $shop http://127.0.0.1:3000;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-For $remote_addr;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection $fa_connection;

  # The shop's API and the paths its pages and challenges use. Exact matches and
  # "prefix/" matches are deliberate: /api-docs, /profile, /b2b, /support, and
  # /vendor themselves stay 404, as in the breach log.
  location = /              { proxy_pass $shop; }
  location = /robots.txt    { proxy_pass $shop; }
  location = /security.txt  { proxy_pass $shop; }
  location = /api           { proxy_pass $shop; }
  location ^~ /api/         { proxy_pass $shop; }
  location = /rest          { proxy_pass $shop; }
  location ^~ /rest/        { proxy_pass $shop; }
  location = /ftp           { proxy_pass $shop; }
  location ^~ /ftp/         { proxy_pass $shop; }
  location ^~ /socket.io/   { proxy_pass $shop; }
  location ^~ /assets/      { proxy_pass $shop; }
  location ^~ /.well-known/ { proxy_pass $shop; }
  location = /metrics       { proxy_pass $shop; }
  location = /redirect      { proxy_pass $shop; }
  location = /file-upload   { proxy_pass $shop; }
  location = /promotion     { proxy_pass $shop; }
  location = /video         { proxy_pass $shop; }
  location = /dataerasure   { proxy_pass $shop; }
  location ^~ /profile/     { proxy_pass $shop; }
  location ^~ /b2b/         { proxy_pass $shop; }
  location ^~ /support/     { proxy_pass $shop; }
  location ^~ /vendor/      { proxy_pass $shop; }
  location ^~ /snippets     { proxy_pass $shop; }
  location ^~ /solve/       { proxy_pass $shop; }
  location ^~ /encryptionkeys { proxy_pass $shop; }
  location ^~ /infrastructure { proxy_pass $shop; }
  location ^~ /the/         { proxy_pass $shop; }
  location ^~ /this/        { proxy_pass $shop; }
  location ^~ /we/          { proxy_pass $shop; }

  # Top-level frontend files (main.js, styles.css, ...), generated at image build.
  include /etc/nginx/fieldagents-dist.conf;

  location / { return 404; }
}
