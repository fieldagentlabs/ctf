name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  grader:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        # 3.9 is the oldest supported; 3.12 matches the Codespace image.
        python: ["3.9.21", "3.12.8"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Grader unit tests
        run: python -m unittest discover -s platform/grader/tests -v
      - name: CLI unit tests
        run: python -m unittest discover -s platform/control/tests -v
      - name: Lint
        run: python tools/lint.py
