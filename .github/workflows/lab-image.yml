# Builds the lab image with a throwaway key and smoke-tests it. The published
# image (real key) is built by the private ctf-hq repo, not here.
#
# Deliberately does not solve any Juice Shop challenge: that would publish a
# walkthrough. The full F2 pass runs in ctf-hq's regression workflow.
name: lab-image

on:
  push:
    branches: [main]
    paths: [".devcontainer/**", "platform/**", ".github/workflows/lab-image.yml"]
  pull_request:
    paths: [".devcontainer/**", "platform/**", ".github/workflows/lab-image.yml"]

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build (throwaway key)
        run: docker build --build-arg CTF_KEY=ci-throwaway -t fa-lab:ci .devcontainer/image

      - name: Start the lab like a Codespace would
        run: |
          docker run -d --name lab -v "$PWD:/workspaces/ctf" -w /workspaces/ctf fa-lab:ci sleep infinity
          docker exec lab sudo ln -sf /workspaces/ctf/platform/control/control.py /usr/local/bin/control
          docker exec lab start-shop
          docker exec lab start-shop   # second run must be a no-op

      - name: Tools are installed
        run: |
          docker exec lab bash -lc 'node --version && python3 --version && claude --version && control verify zz; test $? -eq 2'
          docker exec lab python3 -c "import sigma.matching, importlib.metadata as m; assert m.version('pySigma') == '2.1.0'; print('pySigma 2.1.0')"

      - name: Both hostnames reach the shop
        run: |
          docker exec lab curl -fsS http://localhost:3000/rest/admin/application-version
          docker exec lab curl -fsS http://shop.fieldagents.test:3000/rest/admin/application-version

      - name: Shop runs in CTF mode
        run: |
          docker exec lab curl -fsS http://localhost:3000/rest/admin/application-configuration \
            | python3 -c "import json,sys; c=json.load(sys.stdin)['config']; assert c['ctf']['showFlagsInNotifications'] is True, c['ctf']; print('CTF mode on')"

      - name: control verify f2 reaches the live shop and fails cleanly
        run: |
          set +e
          out=$(docker exec lab control verify f2 2>&1); code=$?
          set -e
          echo "$out"
          test "$code" -eq 1
          echo "$out" | grep -q "Juice Shop Score Board challenge solved"
          ! echo "$out" | grep -q "Can't reach Juice Shop"
          ! echo "$out" | grep -q "FA{"

      - name: nginx front forwards game paths and 404s the rest (matches the breach log)
        run: |
          # Juice Shop sometimes overstates Content-Length (curl exit 18); the status code is still valid.
          code() { docker exec lab curl -s -o /dev/null -w "%{http_code}" "$@" || true; }
          for p in / /ftp /robots.txt /rest/admin/application-version "/rest/products/search?q=apple" /metrics /assets/public/images/padding/1px.png; do
            c=$(code "http://shop.fieldagents.test$p"); echo "$p -> $c"; test "$c" != 404
          done
          js=$(docker exec lab sh -c 'cd /opt/juice-shop/frontend/dist/frontend && ls *.js | head -1')
          test "$(code http://shop.fieldagents.test/$js)" = 200
          for p in /backup.zip /api-docs /profile /b2b /support /vendor /config.json /assets /socket.io; do
            c=$(code "http://shop.fieldagents.test$p"); echo "$p -> $c"; test "$c" = 404
          done

      - name: nginx logs in the breach log's format, with the request body
        run: |
          docker exec lab curl -s -o /dev/null -X POST http://shop.fieldagents.test/rest/user/login \
            -H 'Content-Type: application/json' -d '{"email":"nobody@mail.example","password":"wrong"}'
          sleep 1
          line=$(docker exec lab tail -n 1 /var/log/shop/access.log)
          echo "$line"
          echo "$line" | grep -Eq '^127\.0\.0\.1 - - \[[0-9]{2}/[A-Z][a-z]{2}/[0-9]{4}:[0-9:]{8} \+0000\] "POST /rest/user/login HTTP/1\.1" 401 [0-9]+ "-" "curl/[^"]*" "\{\\"email\\":\\"nobody@mail\.example\\",\\"password\\":\\"wrong\\"\}"$'

      - name: Canary records hits
        run: |
          docker exec lab curl -s -o /dev/null http://canary.fieldagents.test:8081/ping?k=1
          docker exec lab grep -q '"path": "/ping?k=1"' /tmp/canary.log

      - name: Source checkout, deploy-shop, and restore (K4 and K7 depend on this)
        run: |
          docker exec -e JUICE_SHOP_SRC=/tmp/js-src lab init-juice-shop-src
          docker exec lab git -C /tmp/js-src tag --list | grep -qx v20.4.0
          docker exec lab sed -i "s/version: config.get('application.showVersionNumber') ? utils.version() : ''/version: 'patched-by-ci'/" /tmp/js-src/routes/appVersion.ts
          docker exec lab grep -q patched-by-ci /tmp/js-src/routes/appVersion.ts
          docker exec -e JUICE_SHOP_SRC=/tmp/js-src lab deploy-shop
          docker exec lab curl -fsS http://localhost:3000/rest/admin/application-version | grep -q patched-by-ci
          docker exec lab deploy-shop --original
          ! docker exec lab curl -fsS http://localhost:3000/rest/admin/application-version | grep -q patched-by-ci
          echo "deploy-shop patched and restored a route"

      - name: Logs on failure
        if: failure()
        run: |
          docker exec lab tail -n 50 /tmp/juice-shop.log || true
          docker exec lab tail -n 30 /tmp/deploy-shop-tsc.log || true
          docker exec lab tail -n 20 /var/log/shop/error.log || true
